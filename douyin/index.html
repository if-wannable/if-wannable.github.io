<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>💚 贺峻霖粉丝专用抖音举报链接生成器</title>
<style>
body {
  font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  max-width: 950px;
  margin: 40px auto;
  padding: 20px;
  background: linear-gradient(135deg, #f7fff7 0%, #edf9ef 50%, #dff3e2 100%);
  line-height: 1.6;
}
.box {
  background: rgba(255,255,255,0.96);
  padding: 30px;
  border-radius: 20px;
  border: 2px solid #d8f0dc;
  box-shadow: 0 10px 30px rgba(52,168,83,0.12);
}
.main-title {
  text-align: center;
  font-size: 34px;
  color: #34a853;
  margin-bottom: 6px;
}
.subtitle {
  text-align: center;
  font-size: 16px;
  color: #5f8f69;
  margin-bottom: 18px;
}
.tip {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}
input[type=text], textarea, input[readonly] {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin-top: 6px;
  margin-bottom: 15px;
  border: 1px solid #cde8d1;
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
}
::placeholder { color: rgba(52,168,83,0.35); }
textarea { height: 90px; }
.result { height: 150px; }
input[type=text]:focus, textarea:focus {
  outline: none;
  border-color: #34a853;
  box-shadow: 0 0 0 3px rgba(52,168,83,0.15);
}
button {
  padding: 10px 18px;
  margin: 8px 8px 12px 0;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: #34a853;
  color: white;
  font-size: 14px;
  transition: all 0.2s;
}
button:hover { background: #2d8e48; transform: translateY(-1px); }
button:disabled { background: #9fcca8; cursor: not-allowed; transform: none; }
.section {
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid #d8f0dc;
}
h3 { color: #34a853; margin-top: 0; }
h3.warn { color: #e67e22; }
#qrcode { margin-top: 20px; text-align: center; }
.footer { text-align: center; margin-top: 40px; color: #5f8f69; font-size: 14px; }
#status { font-size: 14px; margin: 0 0 10px; min-height: 20px; }
#status.ok { color: #34a853; }
#status.err { color: #e53935; }
#fallbackSection { display: none; }
#fallbackSection.show { display: block; }
</style>
</head>
<body>
<div class="box">
  <h1 class="main-title">💚 贺峻霖粉丝专用链接生成器</h1>
  <div class="subtitle">🦋 梦蝶破笼 · 振翅自由生长</div>
  <p class="tip">粘贴手机端短链接，自动解析并生成举报链接和二维码。</p>

  <label>视频手机端短链接：</label>
  <input type="text" id="videoShort" placeholder="https://v.douyin.com/…">

  <label>作者手机端短链接：</label>
  <input type="text" id="authorShort" placeholder="https://v.douyin.com/…">

  <button id="parseBtn" onclick="parseAndGenerate()">解析并生成</button>
  <p id="status"></p>

  <!-- 短链解析失败时才显示 -->
  <div id="fallbackSection" class="section">
    <h3 class="warn">⚠️ 短链解析失败，请手动输入网页端链接</h3>
    <label>视频网页链接：</label>
    <input type="text" id="videoUrl" placeholder="https://www.douyin.com/video/… 或含 modal_id=…">
    <label>作者主页链接：</label>
    <input type="text" id="profileUrl" placeholder="https://www.douyin.com/user/MS4wLj…">
    <button onclick="generateFromWeb()">从网页链接生成</button>
  </div>

  <div class="section">
    <h3>自动提取结果</h3>
    <label>作品 ID：</label>
    <input id="objectIdShow" readonly>
    <label>用户加密 ID：</label>
    <input id="secUidShow" readonly>
  </div>

  <div class="section">
    <h3>最终生成链接</h3>
    <textarea id="result" class="result" readonly></textarea>
    <button onclick="copyResult()">复制链接</button>
    <button onclick="openResult()">打开链接</button>
  </div>

  <div class="section">
    <h3>二维码</h3>
    <button onclick="generateQR()">生成二维码</button>
    <button onclick="downloadQR()">下载二维码图片</button>
    <div id="qrcode"></div>
  </div>

  <div class="footer">页面仅对你输入的链接进行本地处理，不会上传内容。</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const TEMPLATE = `snssdk1128://webview?refer=web&from=webview&from_ssr=1&video_share_track_ver=&did=MS4wLjABAAAAhEltVQqw0IO019aRbo-Tp0pvQMoOYB-fGga5Ecn1V-t__n4eX4_H-YNjeJPH6tbI&mid=7646235433218706230&ts=1780715436&share_track_info=%7B%22link_description_type%22%3A%22%22%7D&region=CN&share_sign=ajBOxdDiG4GPlG7R_hphom_RMadaGj1uzjgvJYhBzzI-&tt_from=share_to&with_sec_did=1&from_aid=1128&titleType=title&utm_source=share_to&utm_medium=ios&activity_info=%7B%22social_share_time%22%3A%221780715437%22%2C%22social_author_id%22%3A%22354500756115683%22%2C%22social_share_id%22%3A%2261063326523_1780715437%22%2C%22social_share_user_id%22%3A%2261063326523%22%7D&timestamp=1780715438&share_version=390000&ug_share_id=68cd82a961c5063b_1780715440614&u_code=hlb65133&iid=MS4wLjABAAAALJojJn0PxwivmNM0uBhwVhtOSD9NLbyguIY2geIs1JmsQYRp06R_Qfqo1kNkW1Yd&utm_campaign=client_share&app=aweme&scene_from=share_reflow&ori_scene_from=default&host=www.iesdouyin.com&group_id=7646235543919299749&web_id=7647158969585206793&browser_name=safari&referrer_host=&is_edenx=1&forbid_pasteboard=1&gd_label=click_schema_ug_filter_v1_click_schema_lhft_48148317a&launch_h5_method=click_wap_rf_video_report&url=https%3A%2F%2Fapi.amemv.com%2Ffalcon%2Ffe_douyin_security_react%2Fmortise%2F9879902d-907f-46f3-85e0-678c416f366a%2F%3Freport_type%3Dvideo%26object_id%3D{OBJECT_ID}%26sec_owner_id%3D{SEC_UID}%26enter_from%3Daweme_reflow%26hide_nav_bar%3D1%26should_full_screen%3D1&hide_nav_bar=1&should_full_screen=1&enter_from=aweme_reflow`;

const RESOLVE_API = 'https://1468756186-1w2s37xoom.ap-shanghai.tencentscf.com';

function extractVideoId(text) {
  let m;
  m = text.match(/modal_id=(\d+)/); if (m) return m[1];
  m = text.match(/\/(?:share\/)?(?:note|video)\/(\d{15,20})/); if (m) return m[1];
  m = text.match(/vid=(\d+)/); if (m) return m[1];
  m = text.match(/aweme_id=(\d+)/); if (m) return m[1];
  m = text.match(/object_id(?:%3D|=)(\d+)/); if (m) return m[1];
  return '';
}

function extractSecUid(text) {
  let m;
  m = text.match(/douyin\.com\/user\/([^?&\s]+)/); if (m) return decodeURIComponent(m[1]);
  m = text.match(/sec_uid=([^&\s]+)/); if (m) return decodeURIComponent(m[1]);
  m = text.match(/sec_owner_id(?:%3D|=)([^%&\s]+)/); if (m) return decodeURIComponent(m[1]);
  return '';
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
}

function showFallback(msg) {
  document.getElementById('fallbackSection').classList.add('show');
  if (msg) setStatus(msg, 'err');
}

function hideFallback() {
  document.getElementById('fallbackSection').classList.remove('show');
}

function applyIds(objectId, secUid) {
  document.getElementById('objectIdShow').value = objectId;
  document.getElementById('secUidShow').value = secUid;
  document.getElementById('result').value = TEMPLATE
    .replace('{OBJECT_ID}', encodeURIComponent(objectId))
    .replace('{SEC_UID}', encodeURIComponent(secUid));
  document.getElementById('qrcode').innerHTML = '';
  generateQR();
}

async function resolveShort(url) {
  const res = await fetch(RESOLVE_API + '?url=' + encodeURIComponent(url));
  if (!res.ok) throw new Error('服务返回 ' + res.status);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function parseAndGenerate() {
  const videoShort = document.getElementById('videoShort').value.trim();
  const authorShort = document.getElementById('authorShort').value.trim();

  if (!videoShort && !authorShort) {
    showFallback('请至少输入一个短链接。');
    return;
  }

  if (!RESOLVE_API) {
    showFallback('解析服务未配置，请手动输入网页端链接。');
    return;
  }

  const btn = document.getElementById('parseBtn');
  btn.disabled = true;
  btn.textContent = '正在解析…';
  setStatus('正在解析短链接，请稍候…', '');

  try {
    const [videoData, authorData] = await Promise.all([
      videoShort  ? resolveShort(videoShort)  : Promise.resolve(null),
      authorShort ? resolveShort(authorShort) : Promise.resolve(null),
    ]);

    const objectId = videoData?.videoId || '';
    const secUid   = authorData?.secUid || videoData?.secUid || '';

    if (!objectId || !secUid) throw new Error('未能从短链中提取到所需 ID');

    hideFallback();
    applyIds(objectId, secUid);
    setStatus('解析成功，链接和二维码已生成。', 'ok');
  } catch (e) {
    showFallback('解析失败：' + e.message + '。请手动输入网页端链接。');
  } finally {
    btn.disabled = false;
    btn.textContent = '解析并生成';
  }
}

function generateFromWeb() {
  const allText = document.getElementById('videoUrl').value + '\n' + document.getElementById('profileUrl').value;
  const objectId = extractVideoId(allText);
  const secUid   = extractSecUid(allText);
  if (!objectId) { alert('没有提取到作品 ID，请检查视频链接。'); return; }
  if (!secUid)   { alert('没有提取到用户加密 ID，请检查作者主页链接。'); return; }
  applyIds(objectId, secUid);
  setStatus('已从网页链接生成。', 'ok');
}

async function copyResult() {
  const text = document.getElementById('result').value;
  if (!text) { alert('请先生成链接。'); return; }
  try { await navigator.clipboard.writeText(text); } catch(e) { document.getElementById('result').select(); document.execCommand('copy'); }
  alert('链接已复制！');
}

function openResult() {
  const v = document.getElementById('result').value;
  if (v) location.href = v; else alert('请先生成链接。');
}

function generateQR() {
  const finalLink = document.getElementById('result').value;
  const qrContainer = document.getElementById('qrcode');
  if (!finalLink) { alert('请先生成链接。'); return; }
  qrContainer.innerHTML = '';
  if (typeof QRCode === 'undefined') {
    qrContainer.innerHTML = '<p style="color:red;">二维码库没有加载成功，请检查网络。</p>';
    return;
  }
  try {
    new QRCode(qrContainer, { text: finalLink, width: 280, height: 280, correctLevel: QRCode.CorrectLevel.L });
  } catch(e) {
    qrContainer.innerHTML = '<p style="color:red;">二维码生成失败，链接可能太长。</p>';
  }
}

function downloadQR() {
  const e = document.querySelector('#qrcode canvas, #qrcode img');
  if (!e) { alert('请先生成二维码。'); return; }
  const a = document.createElement('a');
  a.href = e.tagName === 'CANVAS' ? e.toDataURL('image/png') : e.src;
  a.download = 'qrcode.png';
  a.click();
}
</script>
</body>
</html>
