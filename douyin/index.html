<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>💚 贺峻霖粉丝专用抖音举报链接生成器</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  max-width: 680px;
  margin: 0 auto;
  padding: 16px;
  background: linear-gradient(135deg, #f7fff7 0%, #edf9ef 50%, #dff3e2 100%);
  min-height: 100vh;
  line-height: 1.6;
}
.box {
  background: rgba(255,255,255,0.97);
  padding: 20px 18px;
  border-radius: 18px;
  border: 2px solid #d8f0dc;
  box-shadow: 0 6px 24px rgba(52,168,83,0.11);
}
.main-title {
  text-align: center;
  font-size: clamp(17px, 4.2vw, 26px);
  color: #34a853;
  margin: 0 0 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.subtitle {
  text-align: center;
  font-size: 14px;
  color: #5f8f69;
  margin: 0 0 12px;
}
.tip {
  text-align: center;
  color: #777;
  font-size: 13px;
  margin: 0 0 18px;
}
label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: #3a5c40;
  margin-bottom: 4px;
}
input[type=text], textarea, input[readonly] {
  width: 100%;
  padding: 11px 12px;
  margin-bottom: 12px;
  border: 1.5px solid #cde8d1;
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  background: #fafffe;
  color: #273444;
  -webkit-appearance: none;
}
input[type=text]:focus, textarea:focus {
  outline: none;
  border-color: #34a853;
  box-shadow: 0 0 0 3px rgba(52,168,83,0.13);
}
::placeholder { color: rgba(52,168,83,0.38); }
textarea { height: 80px; resize: vertical; }
.result { height: 120px; font-size: 12px; color: #555; }
.btn-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
button {
  flex: 1;
  min-width: 100px;
  padding: 12px 10px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: #34a853;
  color: white;
  font-size: 15px;
  font-family: inherit;
  font-weight: 600;
  transition: background 0.18s, transform 0.12s;
  -webkit-tap-highlight-color: transparent;
}
button:active { background: #2a7d40; transform: scale(0.97); }
button:disabled { background: #9fcca8; cursor: not-allowed; transform: none; }
button.secondary {
  background: #eaf6ec;
  color: #34a853;
  border: 1.5px solid #c2e8cc;
  font-weight: 500;
}
button.secondary:active { background: #d4f0da; }
.btn-full { width: 100%; }
.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}
.tab {
  background: #eaf6ec;
  color: #34a853;
  border: 1.5px solid #c2e8cc;
  font-weight: 500;
}
.tab.active {
  background: #34a853;
  color: #fff;
  border-color: #34a853;
  font-weight: 600;
}
.section {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1.5px solid #e0f2e4;
}
h3 { color: #34a853; margin: 0 0 12px; font-size: 16px; }
h3.warn { color: #e67e22; }
#qrcode { margin-top: 14px; text-align: center; }
#qrcode img, #qrcode canvas { border-radius: 10px; max-width: 100%; }
.qr-hint { font-size: 12px; color: #888; margin-top: 8px; }
.footer { text-align: center; margin-top: 28px; color: #7aaa82; font-size: 12px; }
#status, #userStatus { font-size: 13px; margin: 4px 0 8px; min-height: 18px; }
#status.ok, #userStatus.ok { color: #34a853; }
#status.err, #userStatus.err { color: #e53935; }
.extract-line { font-size: 12px; color: #7a8a80; margin: 4px 0; word-break: break-all; }
.extract-line span:last-child { color: #273444; }
#fallbackSection { display: none; }
#fallbackSection.show { display: block; }
</style>
</head>
<body>
<div class="box">
  <h1 class="main-title">💚 贺峻霖粉丝专用链接生成器</h1>
  <div class="subtitle">🦋 梦蝶破笼 · 振翅自由生长</div>
  <p class="tip">抖音举报二维码生成</p>

  <div class="tabs">
    <button id="tabVideoBtn" class="tab active" onclick="switchTab('video')">抖音视频举报</button>
    <button id="tabUserBtn" class="tab" onclick="switchTab('user')">抖音账号举报</button>
  </div>

  <div id="videoPanel">
    <label>手机端视频分享链接：</label>
    <input type="text" id="videoShort" placeholder="可粘贴完整分享文案，自动提取短链">

    <label>手机端作者分享链接：</label>
    <input type="text" id="authorShort" placeholder="可粘贴完整分享文案，自动提取短链">

    <label for="reportReason">举报理由（可选）：</label>
    <input type="text" id="reportReason" placeholder="填写后会显示在二维码下方，可留空">

    <button id="parseBtn" class="btn-full" onclick="parseAndGenerate()">解析并生成</button>
    <p id="status"></p>

    <div id="fallbackSection" class="section">
      <h3 class="warn">⚠️ 短链解析失败，请手动输入网页端链接</h3>
      <label>视频网页链接：</label>
      <input type="text" id="videoUrl" placeholder="https://www.douyin.com/video/… 或含 modal_id=…">
      <label>作者主页链接：</label>
      <input type="text" id="profileUrl" placeholder="https://www.douyin.com/user/MS4wLj…">
      <button class="btn-full" onclick="generateFromWeb()">从网页链接生成</button>
    </div>
  </div>

  <div id="userPanel" hidden>
    <label>用户主页链接：</label>
    <input type="text" id="userLink" placeholder="可粘贴用户主页分享短链或完整文案，自动提取短链">

    <label for="reportReasonUser">举报理由（可选）：</label>
    <input type="text" id="reportReasonUser" placeholder="填写后会显示在二维码下方，可留空">

    <button id="userParseBtn" class="btn-full" onclick="parseUserAndGenerate()">解析并生成</button>
    <p id="userStatus"></p>

    <div id="userFallbackSection" class="section" style="display:none">
      <h3 class="warn">⚠️ 短链解析失败，请手动输入网页端链接</h3>
      <label>用户主页网页链接：</label>
      <input type="text" id="userProfileUrl" placeholder="https://www.douyin.com/user/MS4wLj…">
      <button class="btn-full" onclick="generateUserFromWeb()">从网页链接生成</button>
    </div>
  </div>

  <div class="section">
    <h3>自动提取结果</h3>
    <p class="extract-line"><span id="idLabel">作品 ID：</span><span id="objectIdShow"></span></p>
    <p class="extract-line">用户加密 ID：<span id="secUidShow"></span></p>
  </div>

  <div class="section" id="resultSection" hidden>
    <h3>最终生成链接</h3>
    <textarea id="result" class="result" readonly></textarea>
    <div class="btn-row">
      <button onclick="copyResult()">复制链接</button>
      <button class="secondary" onclick="openResult()">打开链接</button>
    </div>
  </div>

  <div class="section">
    <h3>二维码</h3>
    <div id="qrcode"></div>
    <p class="qr-hint" id="qrHint" style="display:none">iOS：长按图片 → 存储到相册</p>
    <div class="btn-row" style="margin-top:12px">
      <button onclick="downloadQR()">保存二维码</button>
    </div>
  </div>

  <div class="footer">
    页面仅对你输入的链接进行本地处理，不会上传内容。
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const TEMPLATE = `snssdk1128://webview?url=https%3A%2F%2Faweme.snssdk.com%2Ffalcon%2Fdouyin_falcon%2Freport%2F%3Freport_type%3Dvideo%26object_id%3D{OBJECT_ID}%26sec_owner_id%3D{SEC_UID}%26enter_from%3Daweme_reflow%26hide_nav_bar%3D1%26should_full_screen%3D1&from=webview&refer=web`;

const USER_TEMPLATE = `snssdk1128://webview?url=https%3A%2F%2Faweme.snssdk.com%2Ffalcon%2Fdouyin_falcon%2Freport%2F%3Freport_type%3Duser%26object_id%3D{USER_ID}%26sec_object_id%3D{SEC_UID}%26owner_id%3D{USER_ID}%26sec_owner_id%3D{SEC_UID}%26enter_from%3Dothers_homepage%26hide_nav_bar%3D1%26should_full_screen%3D1&from=webview&refer=web`;

const RESOLVE_API = 'https://1468756186-1w2s37xoom.ap-shanghai.tencentscf.com';

const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
const isMobile = /Mobi|Android/i.test(navigator.userAgent) || isIOS;

function extractVideoId(text) {
  let m;
  m = text.match(/modal_id=(\d+)/); if (m) return m[1];
  m = text.match(/\/(?:share\/)?(?:note|video)\/(\d{15,20})/); if (m) return m[1];
  m = text.match(/vid=(\d+)/); if (m) return m[1];
  m = text.match(/aweme_id=(\d+)/); if (m) return m[1];
  m = text.match(/object_id(?:%3D|=)(\d+)/); if (m) return m[1];
  return '';
}

function extractSecUid(text) {
  let m;
  m = text.match(/(?:douyin\.com\/user\/|iesdouyin\.com\/share\/user\/)([^?&\s]+)/); if (m) return decodeURIComponent(m[1]);
  m = text.match(/sec_uid=([^&\s]+)/); if (m) return decodeURIComponent(m[1]);
  m = text.match(/sec_owner_id(?:%3D|=)([^%&\s]+)/); if (m) return decodeURIComponent(m[1]);
  return '';
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
}

function showFallback(msg) {
  document.getElementById('fallbackSection').classList.add('show');
  if (msg) setStatus(msg, 'err');
}

function hideFallback() {
  document.getElementById('fallbackSection').classList.remove('show');
}

function applyIds(objectId, secUid) {
  document.getElementById('objectIdShow').textContent = objectId;
  document.getElementById('secUidShow').textContent = secUid;
  document.getElementById('result').value = TEMPLATE
    .replace('{OBJECT_ID}', encodeURIComponent(objectId))
    .replace('{SEC_UID}', encodeURIComponent(secUid));
  document.getElementById('qrcode').innerHTML = '';
  generateQR();
}

function pickShortUrl(text) {
  const m = text.match(/https?:\/\/v\.douyin\.com\/[A-Za-z0-9_\-\/]+/);
  return m ? m[0] : text.trim();
}

async function resolveShort(url, type) {
  let api = RESOLVE_API + '?url=' + encodeURIComponent(url);
  if (type) api += '&type=' + encodeURIComponent(type);
  const res = await fetch(api);
  if (!res.ok) throw new Error('服务返回 ' + res.status);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function resolveSecUid(secUid) {
  const res = await fetch(RESOLVE_API + '?sec_uid=' + encodeURIComponent(secUid) + '&type=user');
  if (!res.ok) throw new Error('服务返回 ' + res.status);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function parseAndGenerate() {
  const videoShort = pickShortUrl(document.getElementById('videoShort').value);
  const authorShort = pickShortUrl(document.getElementById('authorShort').value);

  if (!videoShort && !authorShort) {
    showFallback('请至少输入一个短链接。');
    return;
  }

  if (!RESOLVE_API) {
    showFallback('解析服务未配置，请手动输入网页端链接。');
    return;
  }

  const btn = document.getElementById('parseBtn');
  btn.disabled = true;
  btn.textContent = '正在解析…';
  setStatus('正在解析短链接，请稍候…', '');

  try {
    const [videoData, authorData] = await Promise.all([
      videoShort  ? resolveShort(videoShort)  : Promise.resolve(null),
      authorShort ? resolveShort(authorShort) : Promise.resolve(null),
    ]);

    const objectId = videoData?.videoId || '';
    const secUid   = authorData?.secUid || videoData?.secUid || '';

    if (!objectId || !secUid) throw new Error('未能从短链中提取到所需 ID');

    hideFallback();
    applyIds(objectId, secUid);
    setStatus('解析成功，链接和二维码已生成。', 'ok');
  } catch (e) {
    showFallback('解析失败：' + e.message + '。请手动输入网页端链接。');
  } finally {
    btn.disabled = false;
    btn.textContent = '解析并生成';
  }
}

function generateFromWeb() {
  const allText = document.getElementById('videoUrl').value + '\n' + document.getElementById('profileUrl').value;
  const objectId = extractVideoId(allText);
  const secUid   = extractSecUid(allText);
  if (!objectId) { alert('没有提取到作品 ID，请检查视频链接。'); return; }
  if (!secUid)   { alert('没有提取到用户加密 ID，请检查作者主页链接。'); return; }
  applyIds(objectId, secUid);
  setStatus('已从网页链接生成。', 'ok');
}

function switchTab(type) {
  const isVideo = type === 'video';
  document.getElementById('videoPanel').hidden = !isVideo;
  document.getElementById('userPanel').hidden = isVideo;
  document.getElementById('tabVideoBtn').classList.toggle('active', isVideo);
  document.getElementById('tabUserBtn').classList.toggle('active', !isVideo);
  document.getElementById('idLabel').textContent = isVideo ? '作品 ID：' : '用户 ID：';
}

function setUserStatus(msg, cls) {
  const el = document.getElementById('userStatus');
  el.textContent = msg;
  el.className = cls || '';
}

function showUserFallback(msg) {
  document.getElementById('userFallbackSection').style.display = 'block';
  if (msg) setUserStatus(msg, 'err');
}

function hideUserFallback() {
  document.getElementById('userFallbackSection').style.display = 'none';
}

function applyUserIds(userId, secUid) {
  document.getElementById('objectIdShow').textContent = userId;
  document.getElementById('secUidShow').textContent = secUid;
  document.getElementById('result').value = USER_TEMPLATE
    .replace(/\{USER_ID\}/g, encodeURIComponent(userId))
    .replace(/\{SEC_UID\}/g, encodeURIComponent(secUid));
  document.getElementById('qrcode').innerHTML = '';
  generateQR();
}

async function parseUserAndGenerate() {
  const rawText = document.getElementById('userLink').value;
  const userLink = pickShortUrl(rawText);

  if (!userLink) {
    showUserFallback('请输入用户主页链接。');
    return;
  }

  if (!RESOLVE_API) {
    showUserFallback('解析服务未配置，请手动输入网页端链接。');
    return;
  }

  const btn = document.getElementById('userParseBtn');
  btn.disabled = true;
  btn.textContent = '正在解析…';
  setUserStatus('正在解析用户链接，请稍候…', '');

  try {
    let data;
    if (/v\.douyin\.com/.test(userLink)) {
      data = await resolveShort(userLink, 'user');
    } else {
      const directSecUid = extractSecUid(rawText);
      if (!directSecUid) throw new Error('未能提取到用户加密 ID，请粘贴短链或主页链接');
      data = await resolveSecUid(directSecUid);
    }

    const userId = data?.userId || '';
    const secUid = data?.secUid || '';

    if (!userId || !secUid) throw new Error('未能从用户链接中提取到所需 ID');

    hideUserFallback();
    applyUserIds(userId, secUid);
    setUserStatus('解析成功，账号举报链接和二维码已生成。', 'ok');
  } catch (e) {
    showUserFallback('解析失败：' + e.message + '。请手动输入网页端链接。');
  } finally {
    btn.disabled = false;
    btn.textContent = '解析并生成';
  }
}

async function generateUserFromWeb() {
  const text = document.getElementById('userProfileUrl').value;
  const secUid = extractSecUid(text);
  if (!secUid) { alert('没有提取到用户加密 ID，请检查主页链接。'); return; }

  try {
    const data = await resolveSecUid(secUid);
    const userId = data?.userId || '';
    if (!userId) throw new Error('未能获取到用户数字 ID');
    applyUserIds(userId, secUid);
    setUserStatus('已从网页链接生成。', 'ok');
  } catch (e) {
    setUserStatus('生成失败：' + e.message, 'err');
  }
}

async function copyResult() {
  const text = document.getElementById('result').value;
  if (!text) { alert('请先生成链接。'); return; }
  try { await navigator.clipboard.writeText(text); } catch(e) { document.getElementById('result').select(); document.execCommand('copy'); }
  alert('链接已复制！');
}

function openResult() {
  const v = document.getElementById('result').value;
  if (v) location.href = v; else alert('请先生成链接。');
}

function generateQR() {
  const finalLink = document.getElementById('result').value;
  const qrContainer = document.getElementById('qrcode');
  if (!finalLink) { alert('请先生成链接。'); return; }
  qrContainer.innerHTML = '';
  if (typeof QRCode === 'undefined') {
    qrContainer.innerHTML = '<p style="color:red;">二维码库没有加载成功，请检查网络。</p>';
    return;
  }
  const size = Math.min(window.innerWidth - 80, 280);
  try {
    new QRCode(qrContainer, { text: finalLink, width: size, height: size, correctLevel: QRCode.CorrectLevel.L });
    if (isMobile) document.getElementById('qrHint').style.display = '';
    finalizeQR();
  } catch(e) {
    qrContainer.innerHTML = '<p style="color:red;">二维码生成失败，链接可能太长。</p>';
  }
}

function getReportReason() {
  const isUser = !document.getElementById('userPanel').hidden;
  const input = document.getElementById(isUser ? 'reportReasonUser' : 'reportReason');
  return input && input.value ? input.value.trim() : '';
}

function finalizeQR() {
  const qrContainer = document.getElementById('qrcode');
  const canvas = qrContainer.querySelector('canvas');
  if (!canvas) return;

  const reason = getReportReason();

  let output = canvas;
  if (reason) {
    const pad = 14;
    const fontSize = 14;
    const textAreaHeight = fontSize + pad * 2;

    output = document.createElement('canvas');
    output.width = canvas.width;
    output.height = canvas.height + textAreaHeight;
    const ctx = output.getContext('2d');

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, output.width, output.height);
    ctx.drawImage(canvas, 0, 0);

    ctx.fillStyle = '#34a853';
    ctx.font = fontSize + 'px "PingFang SC", "Microsoft YaHei", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    let text = reason;
    const maxWidth = output.width - pad * 2;
    if (ctx.measureText(text).width > maxWidth) {
      while (ctx.measureText(text).width > maxWidth && text.length > 1) text = text.slice(0, -1);
      text = text.slice(0, -1) + '…';
    }
    ctx.fillText(text, output.width / 2, canvas.height + textAreaHeight / 2);
  }

  const img = document.createElement('img');
  img.src = output.toDataURL('image/png');
  img.alt = '抖音举报二维码';
  qrContainer.innerHTML = '';
  qrContainer.appendChild(img);
}

async function downloadQR() {
  const el = document.querySelector('#qrcode canvas, #qrcode img');
  if (!el) { alert('请先生成二维码。'); return; }
  const dataUrl = el.tagName === 'CANVAS' ? el.toDataURL('image/png') : el.src;

  // iOS Safari: a.download doesn't work — open in new tab for long-press save
  if (isIOS) {
    window.open(dataUrl, '_blank');
    return;
  }

  // Android / desktop
  try {
    const blob = await fetch(dataUrl).then(r => r.blob());
    const file = new File([blob], 'qrcode.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: '举报二维码' });
      return;
    }
  } catch (_) {}

  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = 'qrcode.png';
  a.click();
}
</script>
</body>
</html>
