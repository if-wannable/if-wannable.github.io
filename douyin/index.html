<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🐰 链接生成器</title>
<style>
:root {
  --ink: #24352c;
  --ink-soft: #5d7166;
  --line: #dfe9e1;
  --card: #ffffff;
  --jade: #2f6b52;
  --jade-deep: #24543f;
  --jade-soft: #eef5f0;
  --jade-line: #d5e6db;
  --danger: #c0563f;
  --warn: #b07a2e;
}
* { box-sizing: border-box; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", -apple-system, Arial, sans-serif;
  max-width: 620px;
  margin: 0 auto;
  padding: 20px 14px 32px;
  background:
    radial-gradient(120% 80% at 50% -10%, #f3f8f4 0%, #eef4ef 45%, #e7efe9 100%);
  min-height: 100vh;
  line-height: 1.6;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
.box {
  background: var(--card);
  padding: 26px 20px 22px;
  border-radius: 22px;
  border: 1px solid var(--line);
  box-shadow: 0 18px 48px -24px rgba(36,84,63,0.35), 0 2px 6px rgba(36,84,63,0.05);
}
.main-title {
  text-align: center;
  font-size: clamp(19px, 4.6vw, 25px);
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--jade-deep);
  margin: 0 0 4px;
}
.tip {
  text-align: center;
  color: var(--ink-soft);
  font-size: 12.5px;
  letter-spacing: 0.4px;
  margin: 0 0 20px;
}
label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-soft);
  margin-bottom: 6px;
}
input[type=text], textarea, input[readonly] {
  width: 100%;
  padding: 12px 13px;
  margin-bottom: 14px;
  border: 1px solid var(--jade-line);
  border-radius: 12px;
  font-size: 14px;
  font-family: inherit;
  background: #fbfdfb;
  color: var(--ink);
  transition: border-color .16s, box-shadow .16s, background .16s;
  -webkit-appearance: none;
}
input[type=text]:focus, textarea:focus {
  outline: none;
  background: #fff;
  border-color: #7fb39a;
  box-shadow: 0 0 0 4px rgba(47,107,82,0.09);
}
::placeholder { color: #a6b8ac; }
textarea { height: 84px; resize: vertical; }
.result { height: 118px; font-size: 12px; color: var(--ink-soft); background: #f8fbf9; }
.btn-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}
button {
  flex: 1;
  min-width: 96px;
  padding: 12px 12px;
  border: 1px solid transparent;
  border-radius: 12px;
  cursor: pointer;
  background: linear-gradient(180deg, #35745a 0%, var(--jade-deep) 100%);
  color: #fff;
  font-size: 15px;
  font-family: inherit;
  font-weight: 600;
  letter-spacing: 0.4px;
  box-shadow: 0 6px 14px -8px rgba(36,84,63,0.8);
  transition: filter .18s, transform .12s, box-shadow .18s;
  -webkit-tap-highlight-color: transparent;
}
button:active { filter: brightness(0.94); transform: scale(0.98); }
button:disabled { background: #b9cdc1; box-shadow: none; cursor: not-allowed; transform: none; }
button.secondary {
  background: var(--jade-soft);
  color: var(--jade);
  border-color: var(--jade-line);
  font-weight: 500;
  box-shadow: none;
}
button.secondary:active { background: #e2eee6; }
.btn-full { width: 100%; }
.tabs {
  display: flex;
  gap: 6px;
  padding: 5px;
  margin-bottom: 20px;
  background: var(--jade-soft);
  border: 1px solid var(--jade-line);
  border-radius: 14px;
}
.tab {
  flex: 1;
  min-width: 0;
  padding: 9px 4px;
  font-size: 13.5px;
  font-weight: 500;
  background: transparent;
  color: var(--ink-soft);
  border-radius: 10px;
  box-shadow: none;
  letter-spacing: 0;
  white-space: nowrap;
}
.tab:active { transform: none; filter: none; }
.tab.active {
  background: #fff;
  color: var(--jade-deep);
  font-weight: 600;
  box-shadow: 0 2px 8px -3px rgba(36,84,63,0.35);
}
.section {
  margin-top: 22px;
  padding-top: 20px;
  border-top: 1px solid #edf2ee;
}
h3 {
  color: var(--jade-deep);
  margin: 0 0 12px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.6px;
}
h3.warn { color: var(--warn); font-size: 13.5px; }
#qrcode { margin-top: 10px; text-align: center; }
#qrcode img { border-radius: 14px; max-width: 100%; height: auto; box-shadow: 0 10px 30px -18px rgba(36,84,63,0.55); }
.qr-hint { font-size: 12px; color: #93a69a; margin-top: 10px; }
.footer { text-align: center; margin-top: 26px; color: #9db2a5; font-size: 11.5px; }
#status, #userStatus, #xhsStatus { font-size: 13px; margin: 6px 0 6px; min-height: 18px; }
#status.ok, #userStatus.ok, #xhsStatus.ok { color: var(--jade); }
#status.err, #userStatus.err, #xhsStatus.err { color: var(--danger); }
.extract-line { font-size: 12px; color: #8fa498; margin: 4px 0; word-break: break-all; }
.extract-line span:last-child { color: var(--ink); }
#fallbackSection { display: none; }
#fallbackSection.show { display: block; }
</style>
</head>
<body>
<div class="box">
  <h1 class="main-title">🐰 链接生成器</h1>
  <p class="tip">🫘 / 🍠 举报二维码生成</p>

  <div class="tabs">
    <button id="tabVideoBtn" class="tab active" onclick="switchTab('video')">🫘 视频</button>
    <button id="tabUserBtn" class="tab" onclick="switchTab('user')">🫘 主页</button>
    <button id="tabXhsBtn" class="tab" onclick="switchTab('xhs')">🍠 笔记</button>
  </div>

  <div id="videoPanel">
    <label>手机端视频分享链接：</label>
    <input type="text" id="videoShort" placeholder="可粘贴完整分享文案，自动提取短链">

    <label>手机端作者分享链接：</label>
    <input type="text" id="authorShort" placeholder="可粘贴完整分享文案，自动提取短链">

    <label for="reportReason">举报理由（可选）：</label>
    <input type="text" id="reportReason" placeholder="填写后会显示在二维码下方，可留空">

    <button id="parseBtn" class="btn-full" onclick="parseAndGenerate()">解析并生成</button>
    <p id="status"></p>

    <div id="fallbackSection" class="section">
      <h3 class="warn">⚠️ 短链解析失败，请手动输入网页端链接</h3>
      <label>视频网页链接：</label>
      <input type="text" id="videoUrl" placeholder="https://www.douyin.com/video/… 或含 modal_id=…">
      <label>作者主页链接：</label>
      <input type="text" id="profileUrl" placeholder="https://www.douyin.com/user/MS4wLj…">
      <button class="btn-full" onclick="generateFromWeb()">从网页链接生成</button>
    </div>
  </div>

  <div id="userPanel" hidden>
    <label>用户主页链接：</label>
    <input type="text" id="userLink" placeholder="可粘贴用户主页分享短链或完整文案，自动提取短链">

    <label for="reportReasonUser">举报理由（可选）：</label>
    <input type="text" id="reportReasonUser" placeholder="填写后会显示在二维码下方，可留空">

    <button id="userParseBtn" class="btn-full" onclick="parseUserAndGenerate()">解析并生成</button>
    <p id="userStatus"></p>

    <div id="userFallbackSection" class="section" style="display:none">
      <h3 class="warn">⚠️ 短链解析失败，请手动输入网页端链接</h3>
      <label>用户主页网页链接：</label>
      <input type="text" id="userProfileUrl" placeholder="https://www.douyin.com/user/MS4wLj…">
      <button class="btn-full" onclick="generateUserFromWeb()">从网页链接生成</button>
    </div>
  </div>

  <div id="xhsPanel" hidden>
    <label>举报对象：</label>
    <div class="tabs" style="margin-bottom:14px">
      <button id="xhsTargetNote" class="tab active" onclick="switchXhsTarget('note')">🍠 笔记</button>
      <button id="xhsTargetUser" class="tab" onclick="switchXhsTarget('user')">🍠 用户</button>
    </div>

    <label id="xhsLinkLabel">手机端分享文案或链接：</label>
    <input type="text" id="xhsLink" placeholder="粘贴完整分享文案，自动提取短链">

    <label for="reportReasonXhs">举报理由（可选）：</label>
    <input type="text" id="reportReasonXhs" placeholder="填写后会显示在二维码下方，可留空">

    <button id="xhsParseBtn" class="btn-full" onclick="parseXhsAndGenerate()">解析并生成</button>
    <p id="xhsStatus"></p>

    <div id="xhsFallbackSection" class="section" style="display:none">
      <h3 class="warn">⚠️ 短链解析失败，请手动输入网页端链接</h3>
      <label id="xhsUrlLabel">🍠 笔记网页链接：</label>
      <input type="text" id="xhsNoteUrl" placeholder="https://www.xiaohongshu.com/explore/…">
      <button class="btn-full" onclick="generateXhsFromWeb()">从网页链接生成</button>
    </div>

    <div class="section" id="xhsCandidates" style="display:none">
      <h3>候选链接（逐个试，哪个能打开就用哪个）</h3>
      <div id="xhsCandList"></div>
      <p class="qr-hint">小红书的举报 scheme 未公开，用户举报入口需要用手机实测确认。</p>
    </div>
  </div>

  <div class="section">
    <h3>自动提取结果</h3>
    <p class="extract-line"><span id="idLabel">作品 ID：</span><span id="objectIdShow"></span></p>
    <p class="extract-line" id="secUidLine">用户加密 ID：<span id="secUidShow"></span></p>
  </div>

  <div class="section" id="resultSection" hidden>
    <h3>最终生成链接</h3>
    <textarea id="result" class="result" readonly></textarea>
    <div class="btn-row">
      <button onclick="copyResult()">复制链接</button>
      <button class="secondary" onclick="openResult()">打开链接</button>
    </div>
  </div>

  <div class="section">
    <h3>二维码</h3>
    <div id="qrcode"></div>
    <p class="qr-hint" id="qrHint" style="display:none">iOS：长按图片 → 存储到相册</p>
    <div class="btn-row" style="margin-top:12px">
      <button onclick="downloadQR()">保存二维码</button>
    </div>
  </div>

  <div class="footer">
    页面仅对你输入的链接进行本地处理，不会上传内容。
  </div>
</div>

function extractVideoId(text) {
  let m;
  m = text.match(/modal_id=(\d+)/); if (m) return m[1];
  m = text.match(/\/(?:share\/)?(?:note|video)\/(\d{15,20})/); if (m) return m[1];
  m = text.match(/vid=(\d+)/); if (m) return m[1];
  m = text.match(/aweme_id=(\d+)/); if (m) return m[1];
  m = text.match(/object_id(?:%3D|=)(\d+)/); if (m) return m[1];
  return '';
}

function extractSecUid(text) {
  let m;
  m = text.match(/(?:douyin\.com\/user\/|iesdouyin\.com\/share\/user\/)([^?&\s]+)/); if (m) return decodeURIComponent(m[1]);
  m = text.match(/sec_uid=([^&\s]+)/); if (m) return decodeURIComponent(m[1]);
  m = text.match(/sec_owner_id(?:%3D|=)([^%&\s]+)/); if (m) return decodeURIComponent(m[1]);
  return '';
}

function extractNoteId(text) {
  let m;
  m = text.match(/xhsdiscover:\/\/report\?[^#\s]*\bid=([0-9a-fA-F]{24})/); if (m) return m[1];
  m = text.match(/\/(?:explore|discovery\/item|item)\/([0-9a-fA-F]{24})/); if (m) return m[1];
  m = text.match(/note[_-]?id(?:%3D|=|"?\s*:\s*"?)([0-9a-fA-F]{24})/i); if (m) return m[1];
  m = text.match(/\b([0-9a-f]{24})\b/); if (m) return m[1];
  return '';
}

function extractXhsUserId(text) {
  let m;
  m = text.match(/xiaohongshu\.com\/user\/profile\/([0-9a-fA-F]{24})/); if (m) return m[1];
  m = text.match(/xhsdiscover:\/\/user\/([0-9a-fA-F]{24})/); if (m) return m[1];
  m = text.match(/user[_-]?id(?:%3D|=|"?\s*:\s*"?)([0-9a-fA-F]{24})/i); if (m) return m[1];
  m = text.match(/\b([0-9a-f]{24})\b/); if (m) return m[1];
  return '';
}

function pickXhsShortUrl(text) {
  const m = text.match(/https?:\/\/(?:xhslink\.cn|xhslink\.com|xhs\.link)\/[A-Za-z0-9_\-\/]+/);
  return m ? m[0] : '';
}

function buildXhsUserCandidates(userId) {
  const id = encodeURIComponent(userId);
  return [
    { name: 'report?type=user&id', url: 'xhsdiscover://report?type=user&id=' + id },
    { name: 'report?type=user&user_id', url: 'xhsdiscover://report?type=user&user_id=' + id },
    { name: 'report?type=user&target_id', url: 'xhsdiscover://report?type=user&target_id=' + id },
    { name: 'report?type=user&id&target_type', url: 'xhsdiscover://report?type=user&id=' + id + '&target_type=user' },
    { name: 'report?type=user&id&source', url: 'xhsdiscover://report?type=user&id=' + id + '&source=profile' },
    { name: 'user/{id} 主页', url: 'xhsdiscover://user/' + id },
  ];
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
}

function showFallback(msg) {
  document.getElementById('fallbackSection').classList.add('show');
  if (msg) setStatus(msg, 'err');
}

function hideFallback() {
  document.getElementById('fallbackSection').classList.remove('show');
}

function applyIds(objectId, secUid) {
  document.getElementById('objectIdShow').textContent = objectId;
  document.getElementById('secUidShow').textContent = secUid;
  document.getElementById('result').value = TEMPLATE
    .replace('{OBJECT_ID}', encodeURIComponent(objectId))
    .replace('{SEC_UID}', encodeURIComponent(secUid));
  generateQR('video');
}

function pickShortUrl(text) {
  const m = text.match(/https?:\/\/v\.douyin\.com\/[A-Za-z0-9_\-\/]+/);
  return m ? m[0] : text.trim();
}

async function resolveShort(url, type) {
  let api = RESOLVE_API + '?url=' + encodeURIComponent(url);
  if (type) api += '&type=' + encodeURIComponent(type);
  const res = await fetch(api);
  if (!res.ok) throw new Error('服务返回 ' + res.status);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function resolveSecUid(secUid) {
  const res = await fetch(RESOLVE_API + '?sec_uid=' + encodeURIComponent(secUid) + '&type=user');
  if (!res.ok) throw new Error('服务返回 ' + res.status);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function resolveXhsShort(url) {
  try {
    const data = await resolveShort(url, 'note');
    if (data?.noteId) return data.noteId;
    const id = extractNoteId(data?.finalUrl || '');
    if (id) return id;
  } catch (_) {}

  const meta = await fetch('https://api.microlink.io/?url=' + encodeURIComponent(url) + '&meta=true')
    .then(r => r.json());
  const finalUrl = meta?.data?.url || '';
  const id = extractNoteId(finalUrl) || extractNoteId(JSON.stringify(meta?.data?.url || ''));
  if (!id) throw new Error('短链跳转后未找到笔记 ID');
  return id;
}

async function parseAndGenerate() {
  const videoShort = pickShortUrl(document.getElementById('videoShort').value);
  const authorShort = pickShortUrl(document.getElementById('authorShort').value);

  if (!videoShort && !authorShort) {
    showFallback('请至少输入一个短链接。');
    return;
  }

  if (!RESOLVE_API) {
    showFallback('解析服务未配置，请手动输入网页端链接。');
    return;
  }

  const btn = document.getElementById('parseBtn');
  btn.disabled = true;
  btn.textContent = '正在解析…';
  setStatus('正在解析短链接，请稍候…', '');

  try {
    const [videoData, authorData] = await Promise.all([
      videoShort  ? resolveShort(videoShort)  : Promise.resolve(null),
      authorShort ? resolveShort(authorShort) : Promise.resolve(null),
    ]);

    const objectId = videoData?.videoId || '';
    const secUid   = authorData?.secUid || videoData?.secUid || '';

    if (!objectId || !secUid) throw new Error('未能从短链中提取到所需 ID');

    hideFallback();
    applyIds(objectId, secUid);
    setStatus('解析成功，链接和二维码已生成。', 'ok');
  } catch (e) {
    showFallback('解析失败：' + e.message + '。请手动输入网页端链接。');
  } finally {
    btn.disabled = false;
    btn.textContent = '解析并生成';
  }
}

function generateFromWeb() {
  const allText = document.getElementById('videoUrl').value + '\n' + document.getElementById('profileUrl').value;
  const objectId = extractVideoId(allText);
  const secUid   = extractSecUid(allText);
  if (!objectId) { alert('没有提取到作品 ID，请检查视频链接。'); return; }
  if (!secUid)   { alert('没有提取到用户加密 ID，请检查作者主页链接。'); return; }
  applyIds(objectId, secUid);
  setStatus('已从网页链接生成。', 'ok');
}

function switchTab(type) {
  document.getElementById('videoPanel').hidden = type !== 'video';
  document.getElementById('userPanel').hidden = type !== 'user';
  document.getElementById('xhsPanel').hidden = type !== 'xhs';
  document.getElementById('tabVideoBtn').classList.toggle('active', type === 'video');
  document.getElementById('tabUserBtn').classList.toggle('active', type === 'user');
  document.getElementById('tabXhsBtn').classList.toggle('active', type === 'xhs');
  document.getElementById('idLabel').textContent =
    type === 'video' ? '作品 ID：' : type === 'user' ? '用户 ID：' : '笔记 ID：';
  document.getElementById('secUidLine').hidden = type === 'xhs';
  currentKind = type;
}

function setUserStatus(msg, cls) {
  const el = document.getElementById('userStatus');
  el.textContent = msg;
  el.className = cls || '';
}

function showUserFallback(msg) {
  document.getElementById('userFallbackSection').style.display = 'block';
  if (msg) setUserStatus(msg, 'err');
}

function hideUserFallback() {
  document.getElementById('userFallbackSection').style.display = 'none';
}

function applyUserIds(userId, secUid) {
  document.getElementById('objectIdShow').textContent = userId;
  document.getElementById('secUidShow').textContent = secUid;
  document.getElementById('result').value = USER_TEMPLATE
    .replace(/\{USER_ID\}/g, encodeURIComponent(userId))
    .replace(/\{SEC_UID\}/g, encodeURIComponent(secUid));
  generateQR('user');
}

async function parseUserAndGenerate() {
  const rawText = document.getElementById('userLink').value;
  const userLink = pickShortUrl(rawText);

  if (!userLink) {
    showUserFallback('请输入用户主页链接。');
    return;
  }

  if (!RESOLVE_API) {
    showUserFallback('解析服务未配置，请手动输入网页端链接。');
    return;
  }

  const btn = document.getElementById('userParseBtn');
  btn.disabled = true;
  btn.textContent = '正在解析…';
  setUserStatus('正在解析用户链接，请稍候…', '');

  try {
    let data;
    if (/v\.douyin\.com/.test(userLink)) {
      data = await resolveShort(userLink, 'user');
    } else {
      const directSecUid = extractSecUid(rawText);
      if (!directSecUid) throw new Error('未能提取到用户加密 ID，请粘贴短链或主页链接');
      data = await resolveSecUid(directSecUid);
    }

    const userId = data?.userId || '';
    const secUid = data?.secUid || '';

    if (!userId || !secUid) throw new Error('未能从用户链接中提取到所需 ID');

    hideUserFallback();
    applyUserIds(userId, secUid);
    setUserStatus('解析成功，账号举报链接和二维码已生成。', 'ok');
  } catch (e) {
    showUserFallback('解析失败：' + e.message + '。请手动输入网页端链接。');
  } finally {
    btn.disabled = false;
    btn.textContent = '解析并生成';
  }
}

async function generateUserFromWeb() {
  const text = document.getElementById('userProfileUrl').value;
  const secUid = extractSecUid(text);
  if (!secUid) { alert('没有提取到用户加密 ID，请检查主页链接。'); return; }

  try {
    const data = await resolveSecUid(secUid);
    const userId = data?.userId || '';
    if (!userId) throw new Error('未能获取到用户数字 ID');
    applyUserIds(userId, secUid);
    setUserStatus('已从网页链接生成。', 'ok');
  } catch (e) {
    setUserStatus('生成失败：' + e.message, 'err');
  }
}

function setXhsStatus(msg, cls) {
  const el = document.getElementById('xhsStatus');
  el.textContent = msg;
  el.className = cls || '';
}

function showXhsFallback(msg) {
  document.getElementById('xhsFallbackSection').style.display = 'block';
  if (msg) setXhsStatus(msg, 'err');
}

function hideXhsFallback() {
  document.getElementById('xhsFallbackSection').style.display = 'none';
}

function applyXhsIds(id) {
  const isUser = xhsTarget === 'user';
  document.getElementById('objectIdShow').textContent = id;
  document.getElementById('secUidShow').textContent = '';

  const list = document.getElementById('xhsCandList');
  list.innerHTML = '';

  if (!isUser) {
    document.getElementById('xhsCandidates').style.display = 'none';
    document.getElementById('result').value = XHS_TEMPLATE.replace('{NOTE_ID}', encodeURIComponent(id));
    generateQR('xhs');
    return;
  }

  const cands = buildXhsUserCandidates(id);
  const wrap = document.createElement('div');
  wrap.className = 'btn-row';
  wrap.style.flexDirection = 'column';
  cands.forEach((c, i) => {
    const row = document.createElement('div');
    row.style.cssText = 'width:100%;margin-bottom:10px;text-align:left';
    const label = document.createElement('div');
    label.className = 'extract-line';
    label.textContent = (i + 1) + '. ' + c.name;
    const btn = document.createElement('button');
    btn.className = 'secondary btn-full';
    btn.style.cssText = 'font-size:13px;word-break:break-all;text-align:left;padding:10px';
    btn.textContent = c.url;
    btn.onclick = () => { location.href = c.url; };
    row.appendChild(label);
    row.appendChild(btn);
    wrap.appendChild(row);
  });
  list.appendChild(wrap);
  document.getElementById('xhsCandidates').style.display = 'block';

  document.getElementById('result').value = cands[0].url;
  generateQR('xhs');
}

async function parseXhsAndGenerate() {
  const rawText = document.getElementById('xhsLink').value;
  const shortUrl = pickXhsShortUrl(rawText);
  const isUser = xhsTarget === 'user';
  const extract = isUser ? extractXhsUserId : extractNoteId;

  if (!shortUrl && !extract(rawText)) {
    showXhsFallback(isUser ? '请输入分享文案或用户主页链接。' : '请输入分享文案或笔记链接。');
    return;
  }

  const btn = document.getElementById('xhsParseBtn');
  btn.disabled = true;
  btn.textContent = '正在解析…';
  setXhsStatus('正在解析短链接，请稍候…', '');

  try {
    let id = '';
    if (shortUrl && !isUser) id = await resolveXhsShort(shortUrl);
    if (!id) id = extract(rawText);
    if (!id) throw new Error(isUser ? '未能提取到用户 ID' : '未能提取到笔记 ID');

    hideXhsFallback();
    applyXhsIds(id);
    setXhsStatus(isUser ? '已生成候选链接，请用手机逐个测试。' : '解析成功，链接和二维码已生成。', 'ok');
  } catch (e) {
    showXhsFallback('解析失败：' + e.message + '。' + (isUser ? '请手动输入用户主页链接。' : '请手动输入笔记链接。'));
  } finally {
    btn.disabled = false;
    btn.textContent = '解析并生成';
  }
}

function generateXhsFromWeb() {
  const text = document.getElementById('xhsNoteUrl').value + '\n' + document.getElementById('xhsLink').value;
  const isUser = xhsTarget === 'user';
  const extract = isUser ? extractXhsUserId : extractNoteId;
  const id = extract(text);
  if (!id) { alert(isUser ? '没有提取到用户 ID，请检查链接。' : '没有提取到笔记 ID，请检查链接。'); return; }
  applyXhsIds(id);
  setXhsStatus(isUser ? '已生成候选链接，请用手机逐个测试。' : '已从网页链接生成。', 'ok');
}

function switchXhsTarget(target) {
  xhsTarget = target;
  const isUser = target === 'user';
  document.getElementById('xhsTargetNote').classList.toggle('active', !isUser);
  document.getElementById('xhsTargetUser').classList.toggle('active', isUser);
  document.getElementById('xhsLinkLabel').textContent = isUser ? '用户主页链接：' : '手机端分享文案或链接：';
  document.getElementById('xhsLink').placeholder = isUser
    ? '粘贴用户主页链接，例如 https://www.xiaohongshu.com/user/profile/…'
    : '粘贴完整分享文案，自动提取短链';
  document.getElementById('xhsUrlLabel').textContent = isUser ? '🍠 用户主页网页链接：' : '🍠 笔记网页链接：';
  document.getElementById('xhsNoteUrl').placeholder = isUser
    ? 'https://www.xiaohongshu.com/user/profile/…'
    : 'https://www.xiaohongshu.com/explore/…';
  document.getElementById('xhsCandidates').style.display = 'none';
}

async function copyResult() {
  const text = document.getElementById('result').value;
  if (!text) { alert('请先生成链接。'); return; }
  try { await navigator.clipboard.writeText(text); } catch(e) { document.getElementById('result').select(); document.execCommand('copy'); }
  alert('链接已复制！');
}

function openResult() {
  const v = document.getElementById('result').value;
  if (v) location.href = v; else alert('请先生成链接。');
}

function getReportReason() {
  const id = currentKind === 'user' ? 'reportReasonUser'
           : currentKind === 'xhs' ? 'reportReasonXhs'
           : 'reportReason';
  const input = document.getElementById(id);
  return input && input.value ? input.value.trim() : '';
}

function getKindLabel(kind) {
  if (kind === 'user') return '🫘 主页';
  if (kind === 'xhs') return xhsTarget === 'user' ? '🍠 用户' : '🍠 笔记';
  return '🫘 视频';
}

function loadCardImage() {
  if (CARD_IMG.complete) return Promise.resolve(CARD_IMG);
  return new Promise((resolve, reject) => {
    CARD_IMG.onload = () => resolve(CARD_IMG);
    CARD_IMG.onerror = () => reject(new Error('背景图加载失败'));
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

async function generateQR(kind) {
  const finalLink = document.getElementById('result').value;
  const qrContainer = document.getElementById('qrcode');
  if (!finalLink) { alert('请先生成链接。'); return; }
  qrContainer.innerHTML = '';
  if (typeof QRCode === 'undefined') {
    qrContainer.innerHTML = '<p style="color:red;">二维码库没有加载成功，请检查网络。</p>';
    return;
  }

  const size = Math.min(window.innerWidth - 80, 280);
  const holder = document.createElement('div');
  try {
    new QRCode(holder, { text: finalLink, width: size, height: size, correctLevel: QRCode.CorrectLevel.L });
  } catch (e) {
    qrContainer.innerHTML = '<p style="color:red;">二维码生成失败，链接可能太长。</p>';
    return;
  }
  const srcCanvas = holder.querySelector('canvas');
  if (!srcCanvas) {
    qrContainer.innerHTML = '<p style="color:red;">二维码生成失败，请重试。</p>';
    return;
  }

  try {
    const bg = await loadCardImage();
    const canvas = composeCard(bg, srcCanvas, kind || currentKind);
    const img = document.createElement('img');
    img.src = canvas.toDataURL('image/png');
    img.alt = getKindLabel(kind || currentKind) + ' 举报二维码';
    qrContainer.appendChild(img);
    if (isMobile) document.getElementById('qrHint').style.display = '';
  } catch (e) {
    qrContainer.innerHTML = '<p style="color:red;">合成图片失败：' + e.message + '</p>';
  }
}

function composeCard(bg, qrCanvas, kind) {
  const canvas = document.createElement('canvas');
  canvas.width = CARD_W;
  canvas.height = CARD_H;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bg, 0, 0, CARD_W, CARD_H);

  const card = {
    x0: CARD_AREA.x0 * CARD_W,
    y0: CARD_AREA.y0 * CARD_H,
    x1: CARD_AREA.x1 * CARD_W,
    y1: CARD_AREA.y1 * CARD_H,
  };
  const cardW = card.x1 - card.x0;
  const cardH = card.y1 - card.y0;
  const cx = card.x0 + cardW / 2;
  const pad = Math.round(cardW * 0.045);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#12351f';
  ctx.font = '700 46px "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
  ctx.fillText(getKindLabel(kind), cx, card.y0 / 2);

  const reason = getReportReason();
  let reasonFont = 0;
  let reasonHeight = 0;
  if (reason) {
    const maxWidth = cardW - pad * 2;
    reasonFont = Math.round(Math.min(cardW * 0.032, 30));
    ctx.font = '600 ' + reasonFont + 'px "PingFang SC", "Microsoft YaHei", sans-serif';
    while (ctx.measureText(reason).width > maxWidth && reasonFont > 16) {
      reasonFont -= 1;
      ctx.font = '600 ' + reasonFont + 'px "PingFang SC", "Microsoft YaHei", sans-serif';
    }
    reasonHeight = Math.round(reasonFont * 1.9);
  }

  const availTop = card.y0 + pad;
  const availH = cardH - pad * 2 - reasonHeight;
  const qrSize = Math.round(Math.min(cardW - pad * 2, availH));
  const qrLeft = Math.round(cx - qrSize / 2);
  const qrTop = Math.round(availTop + (availH - qrSize) / 2);

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(qrCanvas, qrLeft, qrTop, qrSize, qrSize);
  ctx.imageSmoothingEnabled = true;

  if (reason) {
    ctx.fillStyle = '#2f6b52';
    ctx.font = '600 ' + reasonFont + 'px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText(reason, cx, Math.round(qrTop + qrSize + reasonHeight / 2 + pad * 0.25));
  }

  return canvas;
}

async function downloadQR() {
  const el = document.querySelector('#qrcode canvas, #qrcode img');
  if (!el) { alert('请先生成二维码。'); return; }
  const dataUrl = el.tagName === 'CANVAS' ? el.toDataURL('image/png') : el.src;

  if (isIOS) {
    window.open(dataUrl, '_blank');
    return;
  }

  try {
    const blob = await fetch(dataUrl).then(r => r.blob());
    const file = new File([blob], 'qrcode.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: '举报二维码' });
      return;
    }
  } catch (_) {}

  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = 'qrcode.png';
  a.click();
}
