<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>抖音作品链接工具</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#17212b;background:#f5f7fa}
    *{box-sizing:border-box} body{margin:0;padding:28px 16px 48px;background:linear-gradient(145deg,#f7fbff,#eef3f8)}
    main{max-width:860px;margin:auto;background:#fff;border:1px solid #e4eaf0;border-radius:22px;padding:30px;box-shadow:0 14px 40px #243b5314}
    h1{margin:0;text-align:center;font-size:30px;letter-spacing:.02em;color:#111827}.lead{text-align:center;color:#657385;margin:10px 0 26px}
    .card{border-top:1px solid #edf0f3;padding-top:22px;margin-top:22px} label{display:block;font-weight:600;margin:14px 0 5px}
    textarea,input{width:100%;border:1px solid #d8e0e8;border-radius:11px;padding:12px 13px;font:inherit;background:#fbfcfd;color:#273444} textarea{min-height:82px;resize:vertical} textarea:focus,input:focus{outline:0;border-color:#1677ff;box-shadow:0 0 0 3px #1677ff1a}
    button{border:0;border-radius:10px;background:#1677ff;color:#fff;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;margin:16px 8px 0 0}button:hover{background:#075fd8}.muted{color:#748297;font-size:13px;margin-top:8px}
    .result{min-height:142px;background:#f7faff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){main{padding:22px 18px}h1{font-size:25px}.grid{grid-template-columns:1fr}}
    #qrcode{text-align:center;margin:18px 0 4px;min-height:10px}footer{text-align:center;color:#8a96a3;font-size:13px;margin-top:24px}
  </style>
</head>
<body>
<main>
  <h1>抖音作品链接工具</h1>
  <p class="lead">自动提取作品 ID 与用户加密 ID，生成可打开的抖音举报页面链接</p>
  <label for="shareText">手机端分享文案（可选）</label>
  <textarea id="shareText">2.56 复制打开抖音，看看【打崩你的逻辑～的图文作品】dddd.# hjl# hjl bgm改了  https://v.douyin.com/723EmCIV8hY/ RKj:/ :2pm U@L.JI 06/30</textarea>
  <label for="videoUrl">视频链接</label>
  <textarea id="videoUrl">https://www.douyin.com/note/7673396863831133553?previous_page=app_code_link</textarea>
  <label for="profileUrl">主页链接</label>
  <textarea id="profileUrl">https://www.douyin.com/user/MS4wLjABAAAAwtNSTchEh5kxYFSWCZL7pVZJZon2kNSnf7qXmTqSusej2D7FCoMh80KWJZKX7Pt-?from_tab_name=main&amp;vid=7673396863831133553</textarea>
  <button id="parseBtn" onclick="parseAndGenerate()">解析短链接并生成</button>
  <button onclick="generateLink()">直接使用网页链接</button>
  <p id="status" class="muted"></p>
  <section class="card"><h3>提取结果</h3><div class="grid"><div><label>作品 ID</label><input id="objectIdShow" readonly></div><div><label>用户加密 ID</label><input id="secUidShow" readonly></div></div></section>
  <section class="card"><h3>最终生成链接</h3><textarea id="result" class="result" readonly placeholder="点击“生成链接”后显示"></textarea><button onclick="copyResult()">复制链接</button><button onclick="openResult()">打开链接</button></section>
  <section class="card"><h3>二维码</h3><button onclick="generateQR()">生成二维码</button><button onclick="downloadQR()">下载二维码</button><div id="qrcode"></div></section>
  <footer>页面仅对你输入的链接进行本地处理，不会上传内容。</footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const TEMPLATE='snssdk1128://webview?refer=web&from=webview&from_ssr=1&launch_h5_method=click_wap_rf_video_report&app=aweme&scene_from=share_reflow&group_id={OBJECT_ID}&url=https%3A%2F%2Fapi.amemv.com%2Ffalcon%2Ffe_douyin_security_react%2Fmortise%2F9879902d-907f-46f3-85e0-678c416f366a%2F%3Freport_type%3Dvideo%26object_id%3D{OBJECT_ID}%26sec_owner_id%3D{SEC_UID}%26enter_from%3Daweme_reflow%26hide_nav_bar%3D1%26should_full_screen%3D1&hide_nav_bar=1&should_full_screen=1&enter_from=aweme_reflow';
function extractVideoId(s){let m=s.match(/(?:modal_id=|vid=|video\/|aweme_id=|note\/)(\d+)/)||s.match(/object_id(?:%3D|=)(\d+)/);return m?m[1]:''}
function extractSecUid(s){let m=s.match(/douyin\.com\/user\/([^?&\s]+)/)||s.match(/(?:sec_uid|sec_owner_id)(?:%3D|=)([^%&\s]+)/);return m?decodeURIComponent(m[1]):''}
function generateLink(){const all=document.getElementById('videoUrl').value+'\n'+document.getElementById('profileUrl').value+'\n'+document.getElementById('shareText').value;const id=extractVideoId(all),uid=extractSecUid(all);if(!id)return alert('没有提取到作品 ID，请检查视频链接。');if(!uid)return alert('没有提取到用户加密 ID，请检查主页链接。');document.getElementById('objectIdShow').value=id;document.getElementById('secUidShow').value=uid;document.getElementById('result').value=TEMPLATE.replaceAll('{OBJECT_ID}',encodeURIComponent(id)).replace('{SEC_UID}',encodeURIComponent(uid));document.getElementById('qrcode').innerHTML=''}
async function parseAndGenerate(){
  const text=document.getElementById('shareText').value.trim();
  const short=(text.match(/https?:\/\/v\.douyin\.com\/[A-Za-z0-9_-]+\/?/)||[])[0];
  if(!short){generateLink();return}
  const btn=document.getElementById('parseBtn'),status=document.getElementById('status');btn.disabled=true;btn.textContent='正在解析…';status.textContent='正在解析抖音短链接，请稍候。';
  try{
    // GitHub Pages 无法读取跨域跳转，使用公开 CORS 代理获取最终地址。
    const res=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(short));
    const finalUrl=res.url||''; const body=await res.text();
    const discovered=finalUrl+'\n'+body;
    const id=extractVideoId(discovered),uid=extractSecUid(discovered);
    if(id)document.getElementById('videoUrl').value='https://www.douyin.com/note/'+id;
    if(uid)document.getElementById('profileUrl').value='https://www.douyin.com/user/'+uid;
    if(!id||!uid)throw new Error('未能从跳转页面提取完整信息');
    generateLink();status.textContent='短链接解析成功，已自动填入网页版视频和作者链接。';
  }catch(e){status.textContent='短链接解析失败，请粘贴网页版视频链接和主页链接后点击“直接使用网页链接”。';alert('抖音短链接暂时无法自动解析，可能是抖音或跨域代理限制。')}
  finally{btn.disabled=false;btn.textContent='解析短链接并生成'}
}
async function copyResult(){const v=document.getElementById('result').value;if(!v)return alert('请先生成链接。');try{await navigator.clipboard.writeText(v)}catch(e){const t=document.getElementById('result');t.select();document.execCommand('copy')}alert('链接已复制！')}
function openResult(){const v=document.getElementById('result').value;if(v)location.href=v;else alert('请先生成链接。')}
function generateQR(){const v=document.getElementById('result').value;if(!v)return alert('请先生成链接。');if(typeof QRCode==='undefined')return alert('二维码库加载失败，请检查网络。');const q=document.getElementById('qrcode');q.innerHTML='';new QRCode(q,{text:v,width:240,height:240,correctLevel:QRCode.CorrectLevel.L})}
function downloadQR(){const e=document.querySelector('#qrcode canvas,#qrcode img');if(!e)return alert('请先生成二维码。');const a=document.createElement('a');a.href=e.tagName==='CANVAS'?e.toDataURL('image/png'):e.src;a.download='douyin-qrcode.png';a.click()}
generateLink();
</script>
</body></html>
