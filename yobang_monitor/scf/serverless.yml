# 腾讯云 SCF 部署配置（Serverless Framework Components）
#
# 用法（在 yobang_monitor/scf/ 目录下执行）：
#   1) 前置：Node.js + npm 已安装
#   2) npm install -g serverless
#   3) 复制 .env.example 为 .env，填入凭证（腾讯云密钥 + GitHub token）
#   4) serverless deploy      # 首次部署 / 之后一键重部署（更新代码与配置）
#   5) serverless remove      # 删除函数与触发器
#
# 说明：GITHUB_TOKEN 从 .env 读取，不会写入仓库。
component: scf
name: yobang-monitor

inputs:
  name: yobang-monitor
  src:
    src: ./
    exclude:
      - .env
      - .env.example
      - serverless.yml
  handler: index.main_handler
  runtime: Python3.9
  region: ap-guangzhou
  description: 由你榜监控 - 每10分钟抓取各维度分数并写入 Gist
  memorySize: 128
  timeout: 30
  environment:
    variables:
      GITHUB_TOKEN: ${env:GITHUB_TOKEN}
      GIST_ID: b153fed7b323ef2c10c230f12bd67142
  events:
    - timer:
        parameters:
          name: yobang-monitor-timer
          cronExpression: '0 5,15,25,35,45,55 * * * * *'
          enable: true
