<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>由你榜监控</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="brand">
        <div class="brand-title">由你榜监控</div>
        <div class="brand-subtitle">Uni Chart Monitor</div>
      </div>
      <button id="rankBtn" class="rank-toggle" type="button">
        <span>当前榜单</span>
        <span class="rank-toggle-sub">Top 10</span>
      </button>
      <button id="adminBtn" class="rank-toggle" type="button">
        <span>管理监控</span>
        <span class="rank-toggle-sub">Monitor</span>
      </button>
      <div class="rail-label">监控歌曲</div>
      <div class="monitor-list" id="monitorList"></div>
      <div class="rail-label">往期分数 · 历史榜期</div>
      <div class="issue-list" id="issueList"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="field search-box">
          <label for="searchInput">搜索歌曲（歌名 / 歌手）</label>
          <input id="searchInput" type="text" autocomplete="off" spellcheck="false" placeholder="输入歌名或歌手…">
          <div class="search-results" id="searchResults"></div>
        </div>
        <div class="field">
          <label for="idInput">歌曲 uniId（可粘贴完整链接）</label>
          <div class="row">
            <input id="idInput" type="text" autocomplete="off" spellcheck="false" placeholder="输入 uniId 或粘贴完整链接">
            <button id="loadBtn" class="btn">载入</button>
          </div>
        </div>
        <div class="actions">
          <span id="lastSync" class="sync">等待首次获取…</span>
          <button id="refreshBtn" class="btn">刷新</button>
          <button id="exportBtn" class="btn ghost">导出 CSV</button>
        </div>
      </header>

      <section class="cards" id="cards"></section>

      <div class="day-filter-bar">
        <label class="day-filter-label" for="dayFilter">时间窗口</label>
        <select id="dayFilter" class="day-select"></select>
      </div>

      <section class="panel">
        <div class="panel-head">
          <h1>分数趋势</h1>
          <div class="mode" id="trendMode">
            <button class="active" data-mode="score">实时分数</button>
            <button data-mode="delta">区间涨幅</button>
          </div>
        </div>
        <div class="scroll"><canvas id="trendCanvas"></canvas></div>
        <div class="trend-legend" id="trendLegend"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h1>快照日志</h1>
          <span class="hint" id="rowCount"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead id="thead"></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div class="modal" id="rankModal">
    <div class="modal-card">
      <div class="modal-head">
        <h2>当前榜单</h2>
        <span class="hint" id="rankIssueTitle"></span>
        <button id="rankClose" class="close-btn" type="button">×</button>
      </div>
      <div class="rank-list" id="rankList"></div>
    </div>
  </div>

  <div class="modal" id="adminModal">
    <div class="modal-card">
      <div class="modal-head">
        <h2>管理监控</h2>
        <button id="adminClose" class="close-btn" type="button">×</button>
      </div>
      <div class="admin-row admin-toggle">
        <span>定时抓取开关</span>
        <button id="adminEnableBtn" class="toggle" type="button">已启用</button>
      </div>
      <div class="admin-section">监控歌曲列表</div>
      <div class="admin-track-list" id="adminTrackList"></div>
      <div class="admin-section">添加歌曲（搜索并点击加入）</div>
      <div class="admin-search">
        <input id="adminSearchInput" type="text" autocomplete="off" placeholder="输入歌名或歌手…">
        <div class="search-results" id="adminSearchResults"></div>
      </div>
      <div class="admin-section">清除快照（一段时间）</div>
      <div class="admin-row">
        <label for="clearUniIdInput">歌曲 uniId</label>
        <input id="clearUniIdInput" type="text" placeholder="548948065">
      </div>
      <div class="admin-row">
        <label for="clearStartInput">开始时间（可选）</label>
        <input id="clearStartInput" type="datetime-local">
      </div>
      <div class="admin-row">
        <label for="clearEndInput">结束时间（可选）</label>
        <input id="clearEndInput" type="datetime-local">
      </div>
      <button id="clearSnapsBtn" class="btn ghost" type="button">清除该时间段快照</button>
      <div class="admin-actions">
        <button id="adminSaveBtn" class="btn" type="button">保存配置</button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
