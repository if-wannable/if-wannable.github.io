name: Sync report-tool roster

on:
  push:
    paths:
      - '.github/workflows/sync-report-roster.yml'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch roster from sakura-todo
        run: |
          set -x
          ok=0
          for url in \
            "http://39.96.202.78/api/report-tool/roster" \
            "http://39.96.202.78.nip.io/api/report-tool/roster" \
            "http://39-96-202-78.sslip.io/api/report-tool/roster" ; do
            echo "== trying $url"
            if curl -sS --max-time 40 --retry 2 --retry-delay 8 --retry-all-errors \
                 "$url" -o /tmp/roster.json ; then
              if python3 -c "import json,sys;d=json.load(open('/tmp/roster.json'));sys.exit(0 if isinstance(d.get('roster'),dict) and d['roster'] else 1)" 2>/dev/null; then
                echo "== success: $url"
                head -c 200 /tmp/roster.json; echo
                ok=1
                break
              fi
            fi
          done
          if [ "$ok" != "1" ]; then
            echo "::error::all roster sources unreachable from GitHub runner"
            exit 1
          fi

      - name: Commit if changed
        run: |
          set -e
          python3 - <<'PY'
          import json, pathlib
          src = pathlib.Path('/tmp/roster.json').read_text().strip()
          data = json.loads(src)
          if not isinstance(data.get('roster'), dict) or len(data['roster']) == 0:
              raise SystemExit('invalid roster payload')
          pathlib.Path('batch_db_tousu/roster.json').write_text(json.dumps(data, separators=(',',':')) + '\n')
          print('roster keys:', len(data['roster']))
          PY
          git config user.name "roster-bot"
          git config user.email "roster-bot@users.noreply.github.com"
          if git diff --quiet -- batch_db_tousu/roster.json; then
            echo "no change"
          else
            git add batch_db_tousu/roster.json
            git commit -m "chore(roster): auto sync from sakura-todo"
            git push
          fi
